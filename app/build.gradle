plugins { id 'com.android.application' }

// CI injects the planned release version; local builds keep the bootstrap beta.
def releaseVersionName = System.getenv('POCKET_NES_VERSION_NAME') ?: '1.0.0-beta.1'
def releaseVersionCode = System.getenv('POCKET_NES_VERSION_CODE') ?: '1'
if (!(releaseVersionName ==~ /(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-beta\.[1-9][0-9]*)?/)) {
    throw new GradleException('POCKET_NES_VERSION_NAME must be a stable SemVer or numbered beta version.')
}
if (!(releaseVersionCode ==~ /[1-9][0-9]*/) || new BigInteger(releaseVersionCode) > 2100000000) {
    throw new GradleException('POCKET_NES_VERSION_CODE must be an integer from 1 through 2100000000.')
}

def signingPath = System.getenv('POCKET_NES_SIGNING_PROPERTIES') ?: new File(System.getProperty('user.home'), '.config/pocket-nes/release-signing.properties').path
def signingFile = file(signingPath)
def releaseCredentials = new Properties()
if (signingFile.isFile()) {
    signingFile.withInputStream { releaseCredentials.load(it) }
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { name ->
        if (!releaseCredentials.getProperty(name)) throw new GradleException("Release signing properties are missing ${name}.")
    }
}

android {
    namespace 'com.culpen.nes'
    compileSdk 36
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'com.culpen.nes'
        minSdk 26
        targetSdk 36
        versionCode releaseVersionCode.toInteger()
        versionName releaseVersionName
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static'; cppFlags '-std=c++17' } }
        testInstrumentationRunner 'com.culpen.nes.EmulatorInstrumentation'
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        if (signingFile.isFile()) {
            release {
                storeFile file(releaseCredentials.getProperty('storeFile'))
                storePassword releaseCredentials.getProperty('storePassword')
                keyAlias releaseCredentials.getProperty('keyAlias')
                keyPassword releaseCredentials.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingFile.isFile()) signingConfig signingConfigs.release
        }
    }
}
