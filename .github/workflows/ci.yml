name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Test release automation
        run: python3 -m unittest discover -s tests -p 'test_*release*.py' -v
      - name: Test the native emulator
        run: |
          cmake -S app/src/main/cpp -B build/native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --parallel 2
          ctest --test-dir build/native --output-on-failure
          build/native/nescore_smoke app/src/main/assets/demo.nes
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0 ndk;28.2.13676358 cmake;3.22.1'
      - name: Lint and build Android
        run: ./gradlew lintDebug assembleDebug assembleDebugAndroidTest testDebugUnitTest --console=plain
